# Netlify deployment for the SentinelOps console.
#
# Set VITE_API_BASE_URL in Site settings -> Environment variables to the API's
# full origin (https://…) before the first build. Vite inlines it into the
# bundle, so it must be present at BUILD time -- setting it afterwards has no
# effect until the site is rebuilt.

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every unmatched path serves the shell rather than a 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Vite fingerprints asset filenames, so they are safe to cache indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must not be cached, or a browser keeps requesting the previous
# build's asset names after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
