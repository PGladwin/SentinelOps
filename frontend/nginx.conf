server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console is a single-page app: every route must resolve to index.html
    # so a refresh on a non-root path does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a long cache is safe -- a new build
    # produces new names. index.html itself must never be cached, or browsers
    # keep loading the previous bundle's asset references after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
