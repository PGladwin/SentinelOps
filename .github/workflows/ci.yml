# =============================================================================
# SentinelOps - Continuous Integration
# =============================================================================
# Runs on every push and pull request. Three independent jobs so a frontend
# lint failure does not hide a backend test failure, and vice versa.
#
# The serving contract check is the one worth understanding: it asserts that
# the committed Champion artifacts are mutually consistent and that the API can
# actually load and score with them. A training run that promotes a model
# whose preprocessor bundle disagrees with its feature list produces artifacts
# that pass every unit test and then fail at container start -- which is
# exactly the failure a deployment pipeline must catch before deploying.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        # The serving set is enough for the API and data tests, and skips the
        # MLflow/DVC/Evidently install that dominates the full requirements.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  serving-contract:
    name: Serving contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Validate the committed Champion
        run: python scripts/check_serving_contract.py

      - name: Boot the API and exercise every route
        run: python scripts/smoke_api.py

  # ---------------------------------------------------------------------------
  frontend:
    name: Console build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  docker:
    name: Image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only gate merges on this; it is the slowest job and adds nothing to a
    # push that the other three have not already covered.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: sentinelops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves a loaded model
        run: |
          docker run -d --name api -p 8000:8000 sentinelops-api:ci
          # The model deserializes and the SHAP explainer initializes at
          # startup, which takes appreciably longer than binding the port.
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 3
          done
          cat /tmp/health.json
          # A container that answers /health with model_loaded=false is a
          # broken deploy that would otherwise pass a naive port check.
          grep -q '"model_loaded":true' /tmp/health.json
          docker rm -f api

      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: sentinelops-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
