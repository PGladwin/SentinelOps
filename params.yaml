# =============================================================================
# SentinelOps - Central Parameter Store
# =============================================================================
# All pipeline stages read from this file.
# Do NOT hardcode these values inside Python source files.
# =============================================================================

# ---------------------------------------------------------------------------
# General / Reproducibility
# ---------------------------------------------------------------------------
general:
  random_seed: 42
  project_name: SentinelOps
  version: "0.1.0"

# ---------------------------------------------------------------------------
# Data Paths
# ---------------------------------------------------------------------------
paths:
  parquet_dir: "datasets/CIC-IDS2017-paraquet"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  reference_dir: "data/reference"
  reports_dir: "reports"
  models_dir: "models"
  metrics_dir: "metrics"

# ---------------------------------------------------------------------------
# Data Ingestion (src/data/ingest.py)
# ---------------------------------------------------------------------------
ingestion:
  # Expected Parquet files (order matters for reproducibility)
  expected_files:
    - "Benign-Monday-no-metadata.parquet"
    - "Botnet-Friday-no-metadata.parquet"
    - "Bruteforce-Tuesday-no-metadata.parquet"
    - "DDoS-Friday-no-metadata.parquet"
    - "DoS-Wednesday-no-metadata.parquet"
    - "Infiltration-Thursday-no-metadata.parquet"
    - "Portscan-Friday-no-metadata.parquet"
    - "WebAttacks-Thursday-no-metadata.parquet"

# ---------------------------------------------------------------------------
# Data Cleaning (src/data/clean.py)
# ---------------------------------------------------------------------------
cleaning:
  # Replace Inf / -Inf with NaN before further handling
  replace_inf_with_nan: true

  # Strategy for NaN after Inf replacement: "median" | "mean" | "zero" | "drop"
  nan_fill_strategy: "median"

  # Drop duplicate rows
  drop_duplicates: true

  # Drop columns that are constant across the ENTIRE combined dataset
  drop_constant_columns: true

  # Raw label to canonical class mapping.
  # The normalizer strips whitespace and replaces U+FFFD (replacement char)
  # with " - " before matching these keys.
  label_map:
    "Benign": "BENIGN"
    "Bot": "Botnet"
    "DDoS": "DDoS"
    "DoS GoldenEye": "DoS"
    "DoS Hulk": "DoS"
    "DoS Slowhttptest": "DoS"
    "DoS slowloris": "DoS"
    "FTP-Patator": "BruteForce"
    "Heartbleed": "DoS"
    "Infiltration": "Infiltration"
    "PortScan": "PortScan"
    "SSH-Patator": "BruteForce"
    "Web Attack - Brute Force": "WebAttack"
    "Web Attack - XSS": "WebAttack"
    "Web Attack - Sql Injection": "WebAttack"

  # Integer encoding for final 8 classes
  class_encoding:
    BENIGN: 0
    DoS: 1
    DDoS: 2
    PortScan: 3
    BruteForce: 4
    Botnet: 5
    WebAttack: 6
    Infiltration: 7

# ---------------------------------------------------------------------------
# Preprocessing (src/data/preprocess.py)
# ---------------------------------------------------------------------------
preprocessing:
  # Correlation threshold: drop one feature from highly-correlated pairs
  # Set to null to skip correlation filtering
  correlation_threshold: 0.95

  # Scaler: "standard" | "robust" | "minmax"
  scaler: "robust"

  # Test set fraction
  test_size: 0.20

  # Development sample rows (stratified from full cleaned dataset).
  # null = train on the FULL cleaned dataset. This is the production setting:
  # a 150k sample leaves Infiltration with 2 train / 0 test rows, making its
  # per-class FNR uncomputable and leaving PortScan/Botnet/WebAttack with
  # 19-29 test rows apiece.
  # Lives here rather than behind a CLI flag so DVC can detect changes to it.
  dev_sample_size: null

# ---------------------------------------------------------------------------
# Training (placeholder - populated in Phase 2)
# ---------------------------------------------------------------------------
training:
  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_leaf: 2
    n_jobs: -1
    class_weight: "balanced"

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "mlogloss"
    n_jobs: -1

  mlp:
    hidden_layers: [128, 64, 32]
    # NOTE: no dropout_rate here -- sklearn's MLPClassifier does not support
    # dropout, so the key that used to sit here was silently ignored.
    batch_size: 512
    max_epochs: 50
    learning_rate: 0.001
    early_stopping_patience: 5

# ---------------------------------------------------------------------------
# Governance (placeholder - populated in Phase 4)
# ---------------------------------------------------------------------------
governance:
  min_f1_improvement: 0.001
  max_mean_fnr: 0.10
  max_per_class_fnr: 0.30

# ---------------------------------------------------------------------------
# Drift Detection (placeholder - populated in Phase 5)
# ---------------------------------------------------------------------------
drift:
  # Fraction of features that must shift before the DATASET is called drifted.
  # One moved column is noise; a fifth of them is a changed world.
  drift_share_threshold: 0.20

  # Per-feature test: "auto" | "ks" | "wasserstein"
  # "auto" uses KS below 1000 rows and normalized Wasserstein above it. A KS
  # test on tens of thousands of rows returns p ~ 0 for differences far too
  # small to act on, so every feature would read as drifted -- it measures
  # confidence that a shift exists, not whether the shift matters.
  stattest: "auto"

  # KS p-value cutoff (small samples).
  pvalue_threshold: 0.05

  # Wasserstein distance in units of the reference standard deviation
  # (large samples). Scale-free, so one threshold works across features.
  distance_threshold: 0.10

  # Rows sampled from the training split to form the baseline.
  reference_max_rows: 50000

# ---------------------------------------------------------------------------
# SOC Dashboard (api/main.py, api/model_service.py)
# ---------------------------------------------------------------------------
soc:
  # Attack-rate cutoffs for the threat-level banner.
  # attack_rate >= high -> HIGH; >= medium -> MEDIUM; otherwise LOW.
  threat_level_thresholds:
    high: 0.20
    medium: 0.05
